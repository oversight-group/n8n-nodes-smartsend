<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 389 389" width="389" height="389">
	<title>SmartSend</title>
	<!--
		Two overlapping rounded triangles. Corner rounding comes from a thick
		round-joined stroke in the same colour as the fill, which keeps the paths
		simple and scales cleanly at the 18px size n8n renders icons at.

		Light variant: mint triangle over dark navy. The mint sits on top at
		partial opacity so the intersection reads as the mid-teal of the brand mark.
	-->
	<g stroke-linejoin="round" stroke-linecap="round" stroke-width="58">
		<path d="M104 176 L360 108 L272 330 Z" fill="#234A5B" stroke="#234A5B" />
		<path d="M58 108 L314 40 L226 262 Z" fill="#6FEBDE" stroke="#6FEBDE" opacity="0.82" />
	</g>
</svg>
