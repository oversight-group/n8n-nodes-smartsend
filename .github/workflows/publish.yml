name: Publish to npm

# n8n requires verified community nodes to be published from GitHub Actions
# with an npm provenance attestation (mandatory since 1 May 2026). Publishing
# from a local machine disqualifies the package from verification.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm provenance: mints the OIDC token that ties the
      # published tarball to this repository and commit.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # n8n-workflow pulls in isolated-vm, a native module we never execute —
      # only its TypeScript types are needed. Skipping install scripts avoids a
      # slow and unnecessary native build.
      - run: npm ci --ignore-scripts

      - run: npm run build
      - run: npm test
      - run: npm run lint

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
