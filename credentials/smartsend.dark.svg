<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 389 389" width="389" height="389">
	<title>SmartSend</title>
	<!--
		Dark variant, for n8n's dark theme. Same geometry as the light icon, but the
		navy triangle becomes white so the mark stays legible on a dark canvas —
		navy on dark would disappear.
	-->
	<g stroke-linejoin="round" stroke-linecap="round" stroke-width="58">
		<path d="M104 176 L360 108 L272 330 Z" fill="#FFFFFF" stroke="#FFFFFF" />
		<path d="M58 108 L314 40 L226 262 Z" fill="#6FEBDE" stroke="#6FEBDE" opacity="0.9" />
	</g>
</svg>
